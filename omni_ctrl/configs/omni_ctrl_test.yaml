# Omni-Ctrl 测试配置（不需要 OpenAI API）

experiment_name: "omni_ctrl_test"
output_dir: "experiments/omni_ctrl_test"
num_iterations: 1
seed: 42
device: "cuda:0"

# Task Generation Configuration
task_gen:
  type: "template"
  templates_path: "omni_ctrl/task_generation/templates.json"

# Scenario Retrieval Configuration
retrieval:
  droid_path: "dataset_example/droid_subset"
  index_path: "experiments/droid_index.faiss"
  clip_model_path: "/mnt/nvme-fast/huggingface/hub/models--openai--clip-vit-base-patch32/snapshots/3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268"
  top_k: 5
  rebuild_index: false

# Policy Router Configuration
router:
  available_policies:
    - name: "pi05"
      checkpoint: "/mnt/nvme-fast/huggingface/hub/openpi-assets/checkpoints/pi05_droid"
      action_space: "joint_vel"
  selection_strategy: "round_robin"

# Rollout Configuration
rollout:
  wm_ckpt: "/mnt/nvme-fast/huggingface/hub/models--yjguo--Ctrl-World/checkpoint-10000.pt"
  svd_model_path: "/mnt/nvme-fast/huggingface/hub/models--stabilityai--stable-video-diffusion-img2vid/snapshots/9cf024d5bfa8f56622af86c884f26a52f6676f2e"
  clip_model_path: "/mnt/nvme-fast/huggingface/hub/models--openai--clip-vit-base-patch32/snapshots/3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268"
  data_stat_path: "dataset_meta_info/droid/stat.json"
  max_steps: 20  # 增加到100步：100/5 = 20次循环 × 5帧 = 100帧 = 20秒
  pred_step: 5
  policy_skip_step: 2
  device: "cuda:1"

# Evaluation Configuration - 使用 dummy 评估器进行测试
evaluation:
  vlm_type: "dummy"  # 使用 dummy 评估器，不需要 API
  api_key: "not-needed"
  max_retries: 3
  timeout: 60
  success_weight: 1.0
  consistency_weight: 0.5

# Skill Library
skill_library_path: "experiments/omni_ctrl_test/skills"

# Logging
log_frequency: 1
video_logging: true
