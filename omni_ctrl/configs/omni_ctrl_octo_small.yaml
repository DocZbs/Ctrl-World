# Example configuration for using Octo with DROID dataset
# Octo is a transformer-based diffusion policy pretrained on 800k+ robot trajectories

experiment_name: "omni_ctrl_octo_small"
output_dir: "experiments/omni_ctrl_octo_small"
num_iterations: 100
seed: 42
device: "cuda:0"

# Task Generation Configuration
task_gen:
  type: "template"
  templates_path: "omni_ctrl/task_generation/templates.json"
  llm_model: "gpt-4"
  llm_api_key: "${OPENAI_API_KEY}"
  droid_meta_path: "dataset_example/droid_subset"

# Scenario Retrieval Configuration
retrieval:
  droid_path: "dataset_example/droid_subset"
  index_path: "experiments/droid_index.faiss"
  clip_model_path: "openai/clip-vit-base-patch32"
  top_k: 5
  rebuild_index: false

# Policy Router Configuration
router:
  available_policies:
    # Octo policy configuration
    - name: "octo"
      # Checkpoint options:
      # - "hf://rail-berkeley/octo-small-1.5" (27M params, faster)
      # - "hf://rail-berkeley/octo-base-1.5" (93M params, better performance - RECOMMENDED)
      checkpoint: "hf://rail-berkeley/octo-small-1.5"  # Small version for speed/resource comparison
      device: "cuda:0"

      # Action space: Octo primarily uses cartesian_delta (end-effector delta)
      # Other options: "joint_pos", "joint_vel" (may require finetuning)
      action_space: "cartesian_delta"

      # Action horizon (chunk size): Octo predicts chunks of actions
      # Default: 4 (predicts 4 future actions at once)
      horizon: 4

      # Task conditioning
      use_language: true        # Use language instructions (recommended)
      use_goal_image: false     # Use goal images instead of language

      # Image processing
      image_size: 256           # Resize images to 256x256 for Octo

    # Optional: Add Pi0.5 for comparison
    # - name: "pi05"
    #   checkpoint: "/path/to/pi05_droid_checkpoint"
    #   action_space: "joint_vel"

  # Selection strategy: "round_robin", "greedy", or "ucb"
  selection_strategy: "round_robin"
  sticky: true  # Use same policy for all episodes
  ucb_coefficient: 1.0

# Rollout Configuration
rollout:
  # World model checkpoints (update paths to your local files)
  wm_ckpt: "/data1/zbs_files/data/HF/hub/models--yjguo--Ctrl-World/snapshots/8cf814693f411962dc866a2ddb5b785afd17a93a/checkpoint-10000.pt"
  svd_model_path: "/data1/zbs_files/data/HF/hub/models--stabilityai--stable-video-diffusion-img2vid/snapshots/9cf024d5bfa8f56622af86c884f26a52f6676f2e"
  clip_model_path: "/data1/zbs_files/data/HF/hub/models--openai--clip-vit-base-patch32/snapshots/3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268"
  data_stat_path: "dataset_meta_info/droid/stat.json"

  # Rollout parameters
  max_steps: 50
  pred_step: 5
  policy_skip_step: 2

  # Action adapter (dynamics model)
  # Note: Octo uses cartesian_delta, so action_adapter may not be needed
  # Set to null or comment out if not using joint_vel actions
  action_adapter_path: null  # "models/action_adapter/model2_15_9.pth"

  device: "cuda:0"

# Evaluation Configuration
evaluation:
  vlm_type: "gpt-4o"
  vlm_model: "gpt-4o"
  api_key: "${OPENAI_API_KEY}"
  max_retries: 3
  timeout: 60
  success_weight: 1.0
  consistency_weight: 0.5

# Skill Library
skill_library_path: "experiments/omni_ctrl_octo/skills"

# Logging
log_frequency: 10
video_logging: true

# Notes:
# 1. Octo is pretrained on Open X-Embodiment dataset (includes DROID-like data)
# 2. Out-of-the-box Octo uses cartesian_delta actions (end-effector delta)
# 3. Octo supports action chunking (predicts multiple future actions)
# 4. For best results, ensure your observation format matches Octo's expectations:
#    - RGB images (multiple cameras supported)
#    - Proprioceptive state (joint positions)
#    - Language instructions
