# Omni-Ctrl 配置 - 使用pi0.5策略批量运行

experiment_name: "pi05_batch"
output_dir: "experiments/pi05_batch"
num_iterations: 1
seed: 42
device: "cuda:0"

# Fixed Scenario Configuration (跳过检索，直接使用指定场景)
fixed_scenario:
  enabled: false  # Will be enabled by script per scenario
  annotation_path: ""  # Will be set by script
  droid_root: "dataset_example/droid_subset"

# Task Generation Configuration
task_gen:
  type: "template"
  templates_path: "omni_ctrl/task_generation/templates.json"

# Scenario Retrieval Configuration (当 fixed_scenario.enabled=true 时会被忽略)
retrieval:
  droid_path: "dataset_example/droid_subset"
  index_path: "experiments/droid_index.faiss"
  clip_model_path: "/mnt/nvme-fast/huggingface/hub/models--openai--clip-vit-base-patch32/snapshots/3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268"
  top_k: 3
  rebuild_index: false

# Policy Router Configuration - 只使用 Pi0.5
router:
  available_policies:
    - name: "pi05"
      checkpoint: "/mnt/nvme-fast/huggingface/hub/openpi-assets/checkpoints/pi05_droid"
      action_space: "joint_vel"
  selection_strategy: "round_robin"
  sticky: true

# Rollout Configuration
rollout:
  wm_ckpt: "/mnt/nvme-fast/huggingface/hub/models--yjguo--Ctrl-World/snapshots/8cf814693f411962dc866a2ddb5b785afd17a93a/checkpoint-10000.pt"
  svd_model_path: "/mnt/nvme-fast/huggingface/hub/models--stabilityai--stable-video-diffusion-img2vid/snapshots/9cf024d5bfa8f56622af86c884f26a52f6676f2e"
  clip_model_path: "/mnt/nvme-fast/huggingface/hub/models--openai--clip-vit-base-patch32/snapshots/3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268"
  data_stat_path: "dataset_meta_info/droid/stat.json"
  max_steps: 100
  pred_step: 5
  policy_skip_step: 2
  action_adapter_path: "models/action_adapter/model2_15_9.pth"
  device: "cuda:1"

# Evaluation Configuration
evaluation:
  vlm_type: "gpt-5.1"
  vlm_model: "gpt-5.1"
  api_key: "${OPENAI_API_KEY}"
  max_retries: 3
  timeout: 60
  success_weight: 1.0
  consistency_weight: 0.5

# Skill Library
skill_library_path: "experiments/omni_ctrl_pi05_batch/skills"

# Logging
log_frequency: 1
video_logging: true
